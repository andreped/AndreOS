name: Update Strava feed

on:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Mondays at 06:00 UTC
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: strava-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Strava activities
        env:
          STRAVA_COOKIE: ${{ secrets.STRAVA_COOKIE }}
        run: node scripts/fetch-strava.mjs

      - name: Upload feed to Cloudflare KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          resp=$(curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/activities" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @public/strava/activities.json)
          echo "$resp"
          echo "$resp" | grep -q '"success":true' || { echo "✖ KV upload failed"; exit 1; }
          echo "✓ Uploaded feed to Cloudflare KV"
